version: '3.8'

services:
  apitoken:
    build: .
    container_name: apitoken
    ports:
      - "3312:3312"
    env_file:
      - .env
    volumes:
      - .:/app
    command: npm run dev
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: token
    ports:
      - "5433:5432"